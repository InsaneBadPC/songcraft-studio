name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Create redirect to the current app
    runs-on: ubuntu-latest
    steps:
      - name: Create redirect
        run: |
          mkdir -p dist
          cat > dist/index.html <<'HTML'
          <!doctype html>
          <html lang="cs">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>SongCraft Studio se přesunulo</title>
            <meta http-equiv="refresh" content="0; url=https://insanebadpc.github.io/songcraft-studio-temney-agent/">
            <link rel="canonical" href="https://insanebadpc.github.io/songcraft-studio-temney-agent/">
            <style>
              body{font-family:system-ui,sans-serif;background:#0b0b0f;color:#f5f5f7;display:grid;place-items:center;min-height:100vh;margin:0;padding:24px;text-align:center}
              a{color:#9fd3ff}
              .card{max-width:560px;border:1px solid #333;border-radius:16px;padding:32px;background:#15151c}
            </style>
          </head>
          <body>
            <div class="card">
              <h1>Tohle je stará verze SongCraft Studia</h1>
              <p>Přesouvám tě na aktuální verzi…</p>
              <p><a href="https://insanebadpc.github.io/songcraft-studio-temney-agent/">Pokračovat ručně</a></p>
            </div>
            <script>location.replace("https://insanebadpc.github.io/songcraft-studio-temney-agent/"+location.hash);</script>
          </body>
          </html>
          HTML
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
