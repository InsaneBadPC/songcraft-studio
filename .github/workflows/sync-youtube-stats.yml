name: Sync YouTube stats (daily)

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  sync:
    name: Call youtube-sync-stats
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sync stats
        run: |
          curl -sS -o - -w "\nHTTP %{http_code}\n" \
            -X POST "https://hfykngbhcxmnpxvjagoj.supabase.co/functions/v1/youtube-sync-stats" \
            -H "Authorization: Bearer ${{ secrets.SONGCRAFT_SERVICE_ROLE_KEY }}" \
            -H "apikey: ${{ secrets.SONGCRAFT_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'