name: Deploy agent orchestrator

on:
  push:
    branches:
      - dev/ai-manager-studio
      - main
    paths:
      - "supabase/functions/agent-orchestrator/**"
      - "supabase/migrations/**"
      - ".github/workflows/deploy-agent-orchestrator.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-agent-orchestrator-${{ vars.SUPABASE_PROJECT_ID }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy agent orchestrator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SONGCRAFT_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SONGCRAFT_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      SONGCRAFT_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_AI_STUDIO_KEY: ${{ secrets.GOOGLE_AI_STUDIO_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Synchronize render-mode constraint
        run: |
          curl --fail-with-body --silent --show-error --retry 3 \
            -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @<(python -c 'import json,sys; print(json.dumps({"query": open(sys.argv[1]).read()}))' supabase/migrations/20260925000000_agent_video_render_types.sql) \
            --output /dev/null

      - name: Configure Edge Function secrets
        run: |
          test -n "$SUPABASE_PROJECT_ID"
          test -n "$SONGCRAFT_SUPABASE_URL"
          test -n "$SONGCRAFT_SUPABASE_ANON_KEY"
          test -n "$SONGCRAFT_SERVICE_ROLE_KEY"
          test -n "$GOOGLE_AI_STUDIO_KEY"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" \
            "SONGCRAFT_SUPABASE_URL=$SONGCRAFT_SUPABASE_URL" \
            "SONGCRAFT_SUPABASE_ANON_KEY=$SONGCRAFT_SUPABASE_ANON_KEY" \
            "SONGCRAFT_SERVICE_ROLE_KEY=$SONGCRAFT_SERVICE_ROLE_KEY" \
            "GOOGLE_AI_STUDIO_KEY=$GOOGLE_AI_STUDIO_KEY"

      - name: Verify Edge Function secret names
        run: |
          names=$(supabase secrets list --project-ref "$SUPABASE_PROJECT_ID" --output json | jq -r '.[].name' | sort)
          for required in SONGCRAFT_SUPABASE_URL SONGCRAFT_SUPABASE_ANON_KEY SONGCRAFT_SERVICE_ROLE_KEY GOOGLE_AI_STUDIO_KEY; do
            printf '%s\\n' "$names" | grep -Fxq "$required"
          done
          echo "required edge secret names present"

      - name: Deploy agent orchestrator
        run: supabase functions deploy agent-orchestrator --project-ref "$SUPABASE_PROJECT_ID"
