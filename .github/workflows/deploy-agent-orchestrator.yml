name: Deploy agent orchestrator

on:
  push:
    branches:
      - dev/ai-manager-studio
      - main
    paths:
      - "supabase/functions/agent-orchestrator/**"
      - ".github/workflows/deploy-agent-orchestrator.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-agent-orchestrator
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy agent orchestrator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Deploy agent orchestrator
        run: supabase functions deploy agent-orchestrator --project-ref "$SUPABASE_PROJECT_ID"
